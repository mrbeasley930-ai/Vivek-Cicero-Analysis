  practiceIntro:"Three more sets of questions on the same passage, each built like the Section A questions on one prescribed text: content, pick-out-and-translate, style, impression and judgement, with the marks rising across the sets. Work through a set in one sitting, under about 20 minutes, with the text open. Write first, then reveal, compare and mark yourself. The line references are the ones on the Eduqas text; stay inside them.",
  practice:[
    { id:"pa", title:"Practice set A — the opening and the offer (lines 1–8)", marks:24,
      intro:"Eight questions in the order the paper would ask them, working down the passage. 24 marks.",
      questions:[
        { id:"a1", marks:2, type:"content", q:"Line 2 (<i>contempsi ... tuos</i>): whose swords does Cicero say he scorned, and whose does he say he will not fear?",
          model:"He scorned the swords of Catiline; he will not fear Antony's ('yours', the man he is addressing).",
          scheme:["1 mark: Catiline's.","1 mark: Antony's / 'yours' / the person addressed. 'The enemy's' on its own is not enough."] },
        { id:"a2", marks:2, type:"latin", q:"Lines 1–2 (<i>defendi ... tuos</i>): pick out and translate the Latin word which shows Cicero's attitude to Catiline's threat.",
          model:"<i>contempsi</i> — 'I scorned' / 'I despised'.",
          scheme:["One mark for <i>contempsi</i>.","One mark for 'I scorned / despised / had contempt for'. 'I defended' is a different word and earns nothing."] },
        { id:"a3", marks:2, type:"content", q:"Lines 2–3 (<i>quin etiam ... potest</i>): what does Cicero say he would do, and how does he say he would feel about doing it?",
          model:"He would offer his body (give up his life); he would do it gladly / willingly.",
          scheme:["1 mark: offer his body / his life / die.","1 mark: gladly / willingly (<i>libenter</i>). 'If it brought freedom' is the condition, not the feeling."] },
        { id:"a4", marks:4, type:"style", q:"Lines 2–3 (<i>quin etiam ... potest</i>): how does Cicero's language make his willingness to die convincing? Make <b>two</b> points and refer to the Latin.",
          model:"<b>1.</b> <i>quin etiam</i>, 'indeed, even', signposts a climax: the sentence steps up from not fearing Antony to offering his life, so that the offer sounds like the next stage of a settled position rather than a sudden boast. <b>2.</b> <i>libenter</i>, 'gladly', is placed between <i>corpus</i> and <i>obtulerim</i>, splitting the noun from its verb so that the adverb is the word the senate hears: the sacrifice is welcomed, which is what makes it believable. <b>3.</b> (alternative) <i>repraesentari</i>, a word for paying in cash, and the alliteration of <i>morte mea</i> make his death a price paid at once, by him, for the state's <i>libertas</i>: the transaction is concrete and the buyer is named.",
          scheme:["Two marks per point: Latin + what Cicero does + effect linked to 'convincing'.","Any two of the three points, or another valid point inside lines 2–3 (the open condition <i>si ... potest</i>; the physical noun <i>corpus</i>).","A device named without an effect earns one mark at most."] },
        { id:"a5", marks:3, type:"content", q:"Lines 3–4 (<i>ut aliquando ... parturit</i>): what does Cicero hope will happen as a result of his death? Give <b>three</b> details.",
          model:"That the anguish (pain, indignation) of the Roman people would at last (<i>aliquando</i>) give birth to (produce) what it has for a long time (<i>iam diu</i>) been in labour with (been working towards): that is, action against Antony.",
          scheme:["1 mark: the anguish / suffering of the Roman people.","1 mark: would (at last) produce / give birth to a result.","1 mark: what it has long been labouring for / working towards; or 'at last' / 'for a long time' as a separate timing detail. Three details from these lines; the childbirth image is content here, not style."] },
        { id:"a6", marks:2, type:"interp", q:"Lines 3–4 (<i>ut aliquando ... parturit</i>): what impression do you get of the Roman people from these lines? Give <b>one</b> reason.",
          model:"That they are suffering and have been for a long time, but are on the point of acting: <i>dolor</i>, 'anguish', and <i>iam diu</i>, 'for a long time now', make them a people in pain, while <i>pariat</i>, 'may give birth', makes the pain purposeful, a labour that will produce something. (Also acceptable: that they are passive and need Cicero's death to make them act.)",
          scheme:["1 mark for a clear impression (suffering / long-suffering / ready to act / needing a push).","1 mark for a reason from lines 3–4: <i>dolor</i>, <i>iam diu</i>, <i>aliquando</i>, the childbirth image."] },
        { id:"a7", marks:6, type:"style", q:"Lines 4–8 (<i>etenim ... gessi</i>): how does Cicero convince the senate that he does not fear death? Make <b>three</b> points and refer to the Latin.",
          model:"<b>1.</b> The argument from the stronger case in a rhetorical question: <i>negavi posse mortem immaturam esse consulari, quanto verius nunc negabo seni?</i>, 'I said that death could not be untimely for a man who had been consul; how much more truly shall I now say it for an old man?': if it was true at 43, it is truer at 62, and the question makes the senate supply the answer. <b>2.</b> <i>hoc ipso in templo</i>, 'in this very temple': the pointing word puts the senators back in the temple of Concord in 63 BC, when he last said this and was right, so that his calm about death has a precedent they witnessed. <b>3.</b> The gerundive <i>optanda mors est</i>, 'death is to be wished for', with <i>iam etiam</i>, 'now even', goes beyond not fearing death to wanting it, and the formal address <i>patres conscripti</i> makes the senate witnesses to the vow. <b>4.</b> (alternative) <i>perfuncto rebus eis quas adeptus sum quasque gessi</i>, 'having completed the things I attained and the things I achieved': two relative clauses sum up a finished career, so that a man with nothing left to gain is shown as a man with nothing left to lose.",
          scheme:["Two marks per point, three points: Latin + what Cicero does + effect linked to 'does not fear death'.","Any three of the four, or other valid points inside lines 4–8 (the tense pair <i>negavi ... negabo</i>; the parallel datives <i>consulari ... seni</i>).","Stay inside lines 4–8: the opening antithesis and the two wishes are outside the reference."] },
        { id:"a8", marks:3, type:"interp", q:"Lines 10–11 (<i>alterum ut ... mereatur</i>): 'Cicero's last sentence is a threat, not a wish.' How far do you agree? Give reasons from these lines.",
          model:"Largely. It is phrased as a wish (<i>opto</i> governs it, and the subjunctive <i>eveniat</i> is the grammar of wishing) and it names nobody, which lets it pass as a prayer for justice. But 'each man as each deserves of the republic' can only mean one thing in November 44 BC: that Antony, who in Cicero's view has deserved ill of the republic, should get what is coming to him, and the senate is left to supply the name. The form is a wish; the content is a threat, and the calm form makes the threat harder to answer.",
          scheme:["1 mark for a clear verdict.","1 mark for a reason on the 'wish' side (the grammar, the generality, the prayer-like form) or the 'threat' side (what 'deserves of the republic' must mean; Antony unnamed but obvious).","1 mark for a developed reason using a specific detail (<i>cuique ... quisque</i>, <i>de re publica</i>, <i>mereatur</i>). A verdict with no reasons earns nothing."] }
      ] },

    { id:"pb", title:"Practice set B — the precedent and the two wishes (lines 4–11)", marks:23,
      intro:"Eight questions, weighted towards the second half of the passage, where the content questions are harder to get right because the Latin is more compressed. 23 marks.",
      questions:[
        { id:"b1", marks:3, type:"content", q:"Lines 4–6 (<i>etenim ... consulari</i>): give <b>three</b> details about the earlier occasion Cicero refers to.",
          model:"It was nearly twenty years ago (63 BC); it was in this very temple (the temple of Concord, where the senate is meeting); he said that death could not be untimely (premature) for a man who had been consul.",
          scheme:["1 mark: nearly twenty years ago.","1 mark: in this (very) temple / where the senate is now meeting.","1 mark: he said death could not be untimely for an ex-consul. 'During the Catiline conspiracy' is true but is not in the lines; it earns nothing on its own."] },
        { id:"b2", marks:2, type:"latin", q:"Lines 4–6 (<i>etenim ... seni</i>): pick out and translate the Latin word which means 'untimely'.",
          model:"<i>immaturam</i> — 'untimely' / 'premature' / 'too early'.",
          scheme:["One mark for <i>immaturam</i>.","One mark for 'untimely / premature / too early'. 'Immature' is not an acceptable translation here."] },
        { id:"b3", marks:4, type:"style", q:"Lines 4–6 (<i>etenim ... seni</i>): how does Cicero's language make his argument persuasive? Make <b>two</b> points and refer to the Latin.",
          model:"<b>1.</b> The structure <i>si ... quanto verius ...?</i>, 'if ... how much more truly ...?', is an argument from the stronger case: the <i>si</i>-clause gives the weaker case (a consul of 43) and the question the stronger (an old man of 62), so that the senate follows the logic step by step and reaches his conclusion for him. <b>2.</b> <i>negavi ... negabo</i>, 'I said ... I shall say': the same verb in the perfect and the future makes what he said then the guarantee of what he says now, so that consistency over twenty years is offered as proof. <b>3.</b> (alternative) <i>hoc ipso in templo</i>, 'in this very temple': the deixis makes the building a witness; the senators are sitting where they followed him against Catiline.",
          scheme:["Two marks per point: Latin + what Cicero does + effect linked to 'persuasive'.","Any two of the three, or the parallel datives <i>consulari ... seni</i>.","Stay inside lines 4–6."] },
        { id:"b4", marks:2, type:"content", q:"Lines 6–7 (<i>mihi ... est</i>): whom is Cicero addressing, and what does he now say about death?",
          model:"The senators (<i>patres conscripti</i>, 'conscript fathers'); death is now even something to be wished for (desired) by him.",
          scheme:["1 mark: the senators / the senate / 'conscript fathers'. 'Antony' is wrong: the <i>tuos</i> of line 2 is not in these lines.","1 mark: death is to be wished for / desirable / something he wants."] },
        { id:"b5", marks:2, type:"latin", q:"Lines 7–8 (<i>perfuncto ... gessi</i>): pick out and translate the Latin word which shows that Cicero regards his life's work as finished.",
          model:"<i>perfuncto</i> — 'having completed' / 'having finished (with)' / 'having accomplished'.",
          scheme:["One mark for <i>perfuncto</i>.","One mark for 'having completed / finished / accomplished'. <i>gessi</i>, 'I achieved', is a near miss: it names the deeds, not their completion."] },
        { id:"b6", marks:2, type:"content", q:"Lines 8–9 (<i>duo modo ... relinquam</i>): what is Cicero's first wish, and when does he want it fulfilled?",
          model:"That he may leave the Roman people free; when he dies (<i>moriens</i>, 'dying').",
          scheme:["1 mark: to leave the Roman people free.","1 mark: at / in his death. 'That everyone gets what they deserve' is the second wish and is outside the reference."] },
        { id:"b7", marks:6, type:"style", q:"Lines 8–11 (<i>duo modo ... mereatur</i>): how does Cicero's language make his two wishes impressive? Make <b>three</b> points and refer to the Latin.",
          model:"<b>1.</b> <i>duo modo haec opto, unum ... alterum</i>, 'I wish for only these two things: one ... the other': the numbering and the restricting word <i>modo</i> give the ending the shape of a will, modest in form, so that the wishes carry the weight of an old man's last requests. <b>2.</b> <i>moriens populum Romanum liberum relinquam</i>, 'that in dying I may leave the Roman people free': <i>liberum</i> is placed last among the words describing the people and before the verb, so that freedom is the one thing that matters, and the participle <i>moriens</i> ties it to his death. <b>3.</b> The parenthesis <i>hoc mihi maius ab dis immortalibus dari nihil potest</i>, 'nothing greater than this can be granted to me by the immortal gods': the aside breaks in as if the thought could not wait, <i>nihil</i> is held back to the end, and the gods make a political wish a prayer. <b>4.</b> (alternative) <i>ita cuique eveniat ut ... quisque mereatur</i>, 'that it may turn out for each man as each deserves': the polyptoton <i>cuique ... quisque</i> gives the curse on Antony the even sound of justice, and the speech ends on <i>re publica</i>.",
          scheme:["Two marks per point, three points: Latin + what Cicero does + effect linked to 'impressive'.","Any three of the four.","Stay inside lines 8–11."] },
        { id:"b8", marks:2, type:"interp", q:"Lines 1–11: what impression do you get of Cicero as a man from this passage? Give <b>one</b> reason.",
          model:"That he is proud of his record and sure of his own importance: he quotes his own speech of 63 BC, lists his honours and achievements, and makes his own death the thing that would free Rome. (Also acceptable: that he is brave, since he offers his life to a man who could take it; or that he is consistent, since he claims the same policy at 62 as at 43.)",
          scheme:["1 mark for a clear impression (proud / self-important / brave / consistent / devoted to the republic).","1 mark for a reason tied to a specific detail from the passage."] }
      ] },

    { id:"pc", title:"Practice set C — whole-passage questions and the 8-mark style question", marks:26,
      intro:"Seven questions that need the whole passage in view, including an 8-mark style question and a paragraph on the question Vivek's examiner is most likely to ask about this text. 26 marks.",
      questions:[
        { id:"c1", marks:8, type:"style", q:"Lines 1–4 (<i>defendi ... parturit</i>): how does Cicero's language make this a dramatic opening? Make <b>four</b> points and refer to the Latin.",
          model:"<b>1.</b> The balanced antithesis <i>defendi rem publicam adulescens, non deseram senex</i>, 'I defended the republic as a young man; I shall not desert it as an old one': perfect against future, young against old, with no connective, so that a whole career is asserted as fact in one line. <b>2.</b> The exact parallel <i>contempsi Catilinae gladios, non pertimescam tuos</i>, 'I scorned the swords of Catiline; I shall not be terrified of yours': Antony, addressed as <i>tuos</i> though he is not present, is put in Catiline's slot and condemned by the structure, and the concrete <i>gladios</i> makes the threat steel. <b>3.</b> <i>quin etiam corpus libenter obtulerim</i>, 'indeed, I would gladly offer my body': <i>quin etiam</i> signposts the climax and <i>libenter</i>, wedged between <i>corpus</i> and its verb, makes the sacrifice welcome rather than endured. <b>4.</b> The metaphor of childbirth, <i>dolor populi Romani pariat quod iam diu parturit</i>, 'the anguish of the Roman people may give birth to what it has long been labouring to deliver': the polyptoton <i>pariat ... parturit</i> keeps the image physical, and the sentence ends as an exclamation, the passage's emotional peak. <b>5.</b> (alternative) <i>repraesentari morte mea libertas</i>: the commercial verb and the alliteration make his death the cash price of Rome's freedom. <b>6.</b> (alternative) The asyndeton of lines 1–2: four clauses with no connective, each landing as a separate blow.",
          scheme:["Two marks per point, four points: Latin + what Cicero does + effect linked to 'dramatic'.","Any four of the six, or other valid points inside lines 1–4.","A device named without an effect earns one mark for that point. Latin without translation or explanation earns nothing."] },
        { id:"c2", marks:2, type:"content", q:"Lines 9–10 (<i>hoc mihi ... potest</i>): what does Cicero say the immortal gods cannot do?",
          model:"They cannot give (grant) him anything greater than this, that is, than leaving the Roman people free.",
          scheme:["1 mark: give / grant him anything greater.","1 mark: than this / than leaving the Roman people free (the comparison). 'The gods cannot save him' is not in the lines."] },
        { id:"c3", marks:2, type:"latin", q:"Lines 8–11 (<i>duo modo ... mereatur</i>): pick out and translate the Latin word with which Cicero limits the number of his wishes.",
          model:"<i>modo</i> — 'only' / 'just'.",
          scheme:["One mark for <i>modo</i>.","One mark for 'only / just'. <i>duo</i> gives the number; it does not limit it."] },
        { id:"c4", marks:2, type:"interp", q:"Lines 7–8 (<i>perfuncto ... gessi</i>): why do you think Cicero mentions his honours and achievements at this point? Give <b>one</b> reason.",
          model:"To explain why death is now acceptable to him, and at the same time to remind the senate of what it owes him: a man who has completed everything he set out to gain and to do has nothing left to lose, and the senate hearing the list is reminded that the gains and the deeds were for the republic. (Also acceptable: to build his authority, ethos, before the two wishes.)",
          scheme:["1 mark for a clear reason (nothing left to lose / reminding the senate of his service / building authority).","1 mark for grounding it in the lines: the two relative clauses, <i>perfuncto</i>, the link to <i>optanda mors est</i>."] },
        { id:"c5", marks:3, type:"interp", q:"Lines 1–11: Cicero never names Antony in this passage. Explain how this makes his attack more effective. Give <b>two</b> reasons.",
          model:"First, the parallel with Catiline does the naming for him: <i>contempsi Catilinae gladios, non pertimescam tuos</i> puts 'yours' in the slot where Catiline's name stood, so Antony is identified as the new traitor by the structure, which is harder to answer than an accusation. Second, the final wish, that each man get what he deserves of the republic, is general enough to pass as a prayer for justice while everyone in the senate supplies Antony's name, so the threat cannot be called a threat. (Also: the one word <i>tuos</i> addresses him directly as if present, which is more contemptuous than naming him.)",
          scheme:["1 mark for each of two clear reasons (the Catiline parallel; the general final wish; the contemptuous <i>tuos</i>).","1 mark for developing at least one reason with a specific detail from the passage. Reasons without reference to the passage earn one mark at most."] },
        { id:"c6", marks:3, type:"content", q:"Lines 1–11: give <b>three</b> facts about his own past that Cicero reminds the senate of in this passage.",
          model:"He defended the republic as a young man (as consul); he scorned the swords (violent threats) of Catiline; nearly twenty years ago in this temple he said death could not be untimely for an ex-consul; he has attained honours and achieved deeds for the state (any three).",
          scheme:["1 mark per fact, three facts, each from the passage.","Facts from outside the passage (that he was consul in 63 BC, that he executed the conspirators, that he was called <i>pater patriae</i>) earn nothing unless the passage states them."] },
        { id:"c7", marks:6, type:"essay", q:"Using this passage only, write <b>one paragraph</b> (about 120–150 words) answering: <i>How does Cicero present himself as a Roman hero?</i> Make a clear point, support it with at least two details from the passage in English, explain each, and end with a sentence that answers the question.",
          model:"Cicero presents himself as a hero whose courage is a lifelong record rather than a single deed. He opens by claiming that he defended the republic as a young man and will not desert it as an old one, and that having scorned Catiline's swords he will not fear Antony's: the two halves of his career are set side by side so that consistency itself looks heroic. He then offers to die, gladly, if his death could buy the freedom of the state, and goes further, telling the senate that for a man who has finished his work death is something to be wished for. This is the language of self-sacrifice that Romans admired in soldiers, and he ends by making a free Rome his dying wish and the greatest gift the gods could give him. Cicero's hero, then, is a man who has served the state all his life and is ready to end that life for it, with the twist that the service was done in words.",
          scheme:["Clear point about how he presents himself.","At least two details from the passage, in English, each explained.","A concluding sentence that answers the question.","No Latin needed; stay inside the passage."] }
      ] }
  ],

  synthesis:{
    title:"Using Cicero in the 16-mark essay",
    intro:"A likely essay: <i>'A Roman hero is a man who is ready to die for Rome.' How far do the texts and pictures you have studied support this view?</i> You need at least four texts or pictures, in English, with every example linked to the question. Cicero is your clearest case of a hero whose heroism is a readiness to die rather than a deed. Practise the Cicero paragraph here; the plan below shows where it sits in a full answer.<br><br><b>A plan for the full essay:</b> (1) Horatius: ready to die and nearly does, the deed itself; (2) Cicero: ready to die in words, and the words came true; (3) Augustus at Actium: the gods fight for him, so he never has to risk death, which complicates the statement; (4) Sejanus and Mezentius: the villains cling to life and power, the opposite of the statement; (5) Camilla, if you have studied her: dies for her side, which tests whether a woman and an enemy of Rome can count. Conclusion: readiness to die is necessary but the texts add two more tests, that the death is for the state and that the gods approve.",
    q:"Write <b>one paragraph</b> (about 130–160 words) on Cicero for that essay. Make a clear point about whether he supports the statement, give at least two specific details from the passage in English, explain each, and end with a sentence that links back to the question. Then add <b>one sentence</b> saying which other text you would use next and why.",
    marks:6,
    model:"Cicero supports the statement, but as a hero in words rather than deeds. In the last paragraph of the Second Philippic he tells the senate that he defended the republic as a young man and will not desert it as an old one, and that having scorned Catiline's swords he will not fear Antony's: his courage is presented as a lifelong record, not a single act. He goes further and says he would gladly offer his body if his death could buy the freedom of the state, and that for a man who has finished his career death is actually something to be wished for. This is the language of a martyr, and a reader might call it a boast, except that the threat was real: Antony had him killed a year later, so the readiness to die was proved by events. Cicero therefore fits the statement exactly, with the twist that his weapon was a speech. Horatius would come next, as the hero whose readiness to die is shown in a deed on the bridge rather than in a declaration.",
    scheme:["Clear point about the statement (does Cicero support it, and how).","At least two specific details from the passage, in English, each explained.","A link back to the question at the end.","One sentence naming the next text and giving a reason (comparison or contrast).","No Latin needed; Latin earns nothing in the essay."]
  }
};

</script>
<script>
/* ===================== helpers ===================== */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripHtml(s){ const d=document.createElement('div'); d.innerHTML=String(s||'').replace(/<br\s*\/?>/gi,' '); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
const CATNAME={ order:"Word order & position", sound:"Sound & rhythm", structure:"Sentence shape & syntax", word:"Choice of words", context:"Fact & context (AO2)" };
const TYPENAME={ content:"Content", latin:"Pick out the Latin", style:"Style", interp:"Impression / judgement", essay:"Essay paragraph" };

/* ===================== state & cloud ===================== */
const CLOUD={ endpoint:window.CLASS_STORE.endpoint, token:window.CLASS_STORE.pupilToken, book:BOOKLET.book };
const LESSON={ id:BOOKLET.id, title:"Booklet "+BOOKLET.num+" — "+stripHtml(BOOKLET.title)+": "+stripHtml(BOOKLET.subtitle) };
const FIXEDCLS="TUTOR";
let IDENTITY=null;
let state={ answers:{}, marks:{}, revealed:{}, read:{}, pnotes:{}, rag:"", opened:{} };
function userKey(){ return IDENTITY?(IDENTITY.cls+"::"+IDENTITY.cand):"anon"; }
function fullKey(){ return CLOUD.book+"::"+userKey(); }
function storeKey(){ return "hv_booklet_"+BOOKLET.num+"_"+(IDENTITY?(IDENTITY.cls+"_"+IDENTITY.cand):"default"); }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const CloudStore={
  async pull(){ if(!IDENTITY) return {ok:false};
    try{ const r=await fetch(CLOUD.endpoint+"?key="+encodeURIComponent(fullKey()),{headers:{"x-vestigia-token":CLOUD.token}});
      if(r.status===404) return {ok:true,data:null}; if(!r.ok) return {ok:false};
      const j=await r.json(); return {ok:true,data:(j&&j.data)?j.data:null}; }catch(e){ return {ok:false}; } },
  async push(blob){ if(!IDENTITY) return false;
    try{ const r=await fetch(CLOUD.endpoint,{method:"POST",headers:{"x-vestigia-token":CLOUD.token,"Content-Type":"application/json"},
      body:JSON.stringify({key:fullKey(),cls:IDENTITY.cls,cand:IDENTITY.cand,book:CLOUD.book,data:blob,savedAt:new Date().toISOString()})}); return r.ok; }catch(e){ return false; } }
};
function mergeState(remote){ if(!remote) return; for(const k of ['answers','marks','revealed','read','pnotes','opened']){ state[k]=Object.assign({},state[k]||{},remote[k]||{}); } if(remote.rag) state.rag=remote.rag; }
function loadLocal(){ try{ const s=JSON.parse(safeGet(storeKey())||"null"); if(s) mergeState(s); }catch(e){} }
let _mt=null;
function save(){ safeSet(storeKey(),JSON.stringify(state)); if(!IDENTITY) return; setSync("saving"); clearTimeout(_mt);
  _mt=setTimeout(async()=>{ const ok=await CloudStore.push(cloudSummary()); setSync(ok?"cloud":"offline"); },700); }
function setSync(s){ const el=$('savestatus'); if(!el) return;
  const map={ saving:["saving…","#e2cb92"], cloud:["✓ saved to class store","#8fd8a6"], offline:["saved on this device — will sync when online","#f0c766"], device:["saved on this device","#8fd8a6"] };
  const m=map[s]||map.device; el.textContent=m[0]; el.style.color=m[1]; }

/* ===================== summary for the tracker ===================== */
function allQ(){ const out=[]; BOOKLET.passages.forEach(p=>p.questions.forEach(q=>out.push({pid:p.id,q,key:p.id+'_'+q.id,sec:p.short}))); (BOOKLET.practice||[]).forEach(s=>s.questions.forEach(q=>out.push({pid:'prac',q,key:'prac_'+s.id+'_'+q.id,sec:s.title}))); out.push({pid:'syn',q:{id:'syn',marks:BOOKLET.synthesis.marks,type:'essay',q:BOOKLET.synthesis.q,model:BOOKLET.synthesis.model,scheme:BOOKLET.synthesis.scheme},key:'syn_syn',sec:BOOKLET.synthesis.title}); return out; }
function cloudSummary(){
  const sections={}; let got=0,max=0,answered=0,total=0;
  const detail=[];
  const groups={}; BOOKLET.passages.forEach(p=>groups[p.id]={name:p.short,answered:0,of:p.questions.length,marks:0,max:0,notesRead:Object.keys(p.notes).filter(k=>state.read[p.id+'_'+k]).length,notesTotal:Object.keys(p.notes).length});
  if(BOOKLET.toolkit) groups.toolkit={name:"Toolkit",answered:0,of:0,marks:0,max:0,notesRead:BOOKLET.toolkit.filter(t=>state.read['tk_'+t.id]).length,notesTotal:BOOKLET.toolkit.length};
  if(BOOKLET.practice) groups.prac={name:"Practice",answered:0,of:BOOKLET.practice.reduce((a,s)=>a+s.questions.length,0),marks:0,max:0,notesRead:0,notesTotal:0};
  groups.syn={name:"Together",answered:0,of:1,marks:0,max:0,notesRead:0,notesTotal:0};
  allQ().forEach(it=>{ const a=(state.answers[it.key]||'').trim(); const mk=state.marks[it.key]; const g=groups[it.pid];
    total++; g.max+=it.q.marks; max+=it.q.marks; if(a){ answered++; g.answered++; } if(mk!=null){ g.marks+=mk; got+=mk; }
    detail.push({ id:it.key, s:it.pid, sec:it.sec, type:it.q.type, marks:it.q.marks, lat:stripHtml(it.q.q), a:a, m:stripHtml(it.q.model), mk:(mk==null?null:mk), revealed:state.revealed[it.key]||null, opened:state.opened[it.key]||null }); });
  for(const k in groups){ sections[k]={pts:groups[k].marks,max:groups[k].max,answered:groups[k].answered,of:groups[k].of,notesRead:groups[k].notesRead,notesTotal:groups[k].notesTotal,name:groups[k].name}; }
  return { name:(IDENTITY?IDENTITY.cand:''), lesson:LESSON.id, title:LESSON.title, book:CLOUD.book, booklet:BOOKLET.num,
    coreGot:got, coreTot:max, answered:answered, total:total, rag:(state.rag||''), pnotes:state.pnotes||{},
    sections:sections, detail:detail, text:summaryText(groups,got,max,answered,total), savedAt:new Date().toISOString(), state:state };
}
function summaryText(g,got,max,answered,total){ let out=LESSON.title+"\n"; for(const k in g){ out+="  "+g[k].name+": "+g[k].answered+"/"+g[k].of+" answered, self-marked "+g[k].marks+"/"+g[k].max+(g[k].notesTotal?(", notes read "+g[k].notesRead+"/"+g[k].notesTotal):"")+"\n"; }
  out+="Total: "+answered+"/"+total+" answered, "+got+"/"+max+" self-marked\n"; if(state.rag) out+="Confidence: "+state.rag+"\n"; return out; }

/* ===================== render ===================== */
function renderHeader(){ $('h-series').innerHTML=BOOKLET.series; $('h-title').innerHTML=BOOKLET.title; $('h-sub').innerHTML=BOOKLET.subtitle; $('h-strap').innerHTML=BOOKLET.strap; $('h-bookno').textContent=BOOKLET.bookno||("BOOKLET "+BOOKLET.num); document.title=stripHtml((BOOKLET.docTitle||("Heroes B"+BOOKLET.num))+" — "+BOOKLET.title+": "+BOOKLET.subtitle); $('foot').innerHTML="Heroes and Villains · "+(BOOKLET.docTitle||("Booklet "+BOOKLET.num))+" · Mr Beasley · saves to the class store as <b>"+esc(CLOUD.book)+"</b>"; }

const TABS=[{id:'guide',label:'Guide'}].concat(BOOKLET.toolkit?[{id:'toolkit',label:'Toolkit'}]:[]).concat(BOOKLET.passages.map(p=>({id:p.id,label:p.short}))).concat(BOOKLET.practice?[{id:'prac',label:'Practice'}]:[]).concat([{id:'syn',label:'Together'}]);
function renderTabs(){ $('tabs').innerHTML=TABS.map(t=>'<button class="tab" data-tab="'+t.id+'" onclick="go(\''+t.id+'\')">'+t.label+'<span class="done" id="tabdone-'+t.id+'"></span></button>').join(''); }
function go(id){ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const p=$('p-'+id); if(p) p.classList.add('active'); const b=document.querySelector('.tab[data-tab="'+id+'"]'); if(b) b.classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); closeSheet(); }

function latHtml(pid,lat,ln){
  const start=parseInt(ln)||0; let k=0;
  let s=lat.replace(/\[\[(\w+)\|([\s\S]*?)\]\]/g,(m,id,txt)=>{ const n=BOOKLET.passages.find(p=>p.id===pid).notes[id]; const cat=n?n.cat:'word'; const rk=state.read[pid+'_'+id]?' read':''; return '<mark class="hl '+cat+rk+'" data-note="'+id+'" data-pid="'+pid+'" tabindex="0" role="button">'+txt+'</mark>'; });
  s=s.replace(/ \/ /g,()=>{ k++; return '<span class="lb" data-n="'+(start+k)+'"></span>'; });
  return s;
}
function renderGuide(){
  const g=BOOKLET.guidance;
  let h='<section class="panel" id="p-guide"><div class="card">';
  h+='<div class="ref">'+esc(stripHtml(BOOKLET.series))+'</div><h2>How this booklet works</h2>';
  h+='<p>'+(BOOKLET.howText||'Three passages, each set out with the Latin on the left and a translation on the right. The coloured phrases in the Latin are the places where a question can be asked: tap one and its note opens beside the text, with what the writer did, the effect, and three model sentences showing how that point would be written in each kind of exam question. At the end of each passage there are exam-style questions. Answer, press <b>Reveal</b>, mark yourself. Everything saves to the class store and follows you to any device.')+'</p>';
  h+='<div class="legend">'+Object.keys(CATNAME).map(c=>'<span class="lg"><span class="sw '+c+'"></span>'+CATNAME[c]+'</span>').join('')+'</div>';
  h+='<div class="themebox">'+BOOKLET.themeNote+'</div>';
  h+='</div>';
  if(g){ h+='<div class="card"><h2>'+g.title+'</h2><p class="small">'+g.intro+'</p>'+g.items.map(it=>'<div class="gitem"><h4>'+it.h+'</h4><p>'+it.p+'</p></div>').join('')+'</div>'; }
  h+='</section>'; return h;
}
function renderToolkit(){
  if(!BOOKLET.toolkit) return '';
  let h='<section class="panel" id="p-toolkit"><div class="card"><div class="ref">Rhetorical devices · recognise, quote, explain</div><h2>The toolkit: the devices the examiner can ask about in this text</h2>';
  h+='<p>'+(BOOKLET.toolkitIntro||'Each entry gives the device, where it happens in the passage, what it does there, and one sentence written in the exam shape: quote, translate, explain, link. Open each one; the booklet records which you have read. Naming a device earns nothing by itself in the exam; the sentence at the end of each entry is the part that earns the marks.')+'</p>';
  h+='<div class="progress"><span>Devices read: <b id="tkr">0</b>/'+BOOKLET.toolkit.length+'</span></div>';
  h+=BOOKLET.toolkit.map(t=>'<details class="tk" data-tk="'+t.id+'" ontoggle="toolOpen(this)"><summary><span class="chip '+t.cat+'">'+CATNAME[t.cat]+'</span><span class="tkname">'+t.name+'</span>'+(t.aka?'<span class="aka">'+t.aka+'</span>':'')+'</summary><div class="tkb"><p>'+t.def+'</p><div class="sec">Where it happens</div><div class="tklat">'+t.lat+'</div>'+(t.tr?'<div class="tktr">'+t.tr+'</div>':'')+'<p>'+t.where+'</p><div class="sec">What it does here</div><p>'+t.effect+'</p><div class="sec">Write it like this</div><div class="write">'+t.write+'</div></div></details>').join('');
  h+='</div></section>'; return h;
}
function toolOpen(el){ if(!el.open) return; const id=el.dataset.tk; if(!state.read['tk_'+id]){ state.read['tk_'+id]=true; el.classList.add('read'); save(); updateProgress(); } }
function renderPassage(p){
  let h='<section class="panel" id="p-'+p.id+'"><div class="card">';
  h+='<div class="ref">'+p.author+' · '+p.work+' · '+p.lines+'</div><h2>'+p.heading+'</h2>';
  h+='<p>'+p.intro+'</p>';
  if(p.facts&&p.facts.length){ h+='<details class="facts"><summary>The facts the examiner can ask for</summary><table>'+p.facts.map(f=>'<tr><th>'+f[0]+'</th><td>'+f[1]+'</td></tr>').join('')+'</table></details>'; }
  h+='<div class="progress"><span>Notes opened: <b id="nr-'+p.id+'">0</b>/'+Object.keys(p.notes).length+'</span><span>Questions answered: <b id="qa-'+p.id+'">0</b>/'+p.questions.length+'</span><span>Self-marked: <b id="qm-'+p.id+'">0</b>/'+p.questions.reduce((a,q)=>a+q.marks,0)+'</span></div>';
  h+='<div class="legend">'+Object.keys(CATNAME).map(c=>'<span class="lg"><span class="sw '+c+'"></span>'+CATNAME[c]+'</span>').join('')+'<span class="note">Tap a phrase to open its note.</span></div>';
  h+='<div class="textwrap"><div class="text"><div class="thead"><span>Line</span><span>Latin</span><span>English</span></div>';
  h+=p.rows.map(r=>'<div class="row"><div class="ln">'+r.ln+'</div><div class="lat">'+latHtml(p.id,r.lat,r.ln)+'</div><div class="en">'+r.en+'</div></div>').join('');
  h+='</div>';
  h+='<aside class="npanel" id="np-'+p.id+'"><div class="nhead"><b>Note</b><span class="cnt" id="ncnt-'+p.id+'"></span><button class="btn nclose" onclick="closeSheet()">Close</button></div><div class="nbody" id="nb-'+p.id+'"><p class="empty">Tap any coloured phrase in the Latin to read its note here.</p></div></aside>';
  h+='</div>';
  h+='<h3>Exam-style questions on this passage</h3><p class="small">Write your answer first. Then reveal the model, compare, and give yourself a mark. Stay inside the lines each question names.</p>';
  h+=p.questions.map((q,i)=>renderQ(p.id,q,i+1)).join('');
  h+='<h3>My notes on this passage</h3><textarea data-pnotes="'+p.id+'" placeholder="Anything from the session: questions, things to check, phrases to learn..." style="min-height:80px"></textarea>';
  h+='</div></section>'; return h;
}
function renderQ(pid,q,n){
  const key=pid+'_'+q.id;
  let h='<div class="q" id="q-'+key+'"><div class="qtop"><span class="qn">'+(pid==='syn'?'':(n+'. '))+'</span><span class="qm">'+q.marks+' mark'+(q.marks===1?'':'s')+'</span><span class="qt">'+(TYPENAME[q.type]||q.type)+'</span></div>';
  h+='<div class="qtext">'+q.q+'</div>';
  h+='<textarea data-q="'+key+'" placeholder="'+(q.type==='style'?'Point 1: quote the Latin, translate it, say what the writer does, give the effect...':(q.type==='latin'?'Latin word — translation':'Your answer, in English...'))+'"></textarea>';
  h+='<div class="qbar"><button class="btn rev" onclick="reveal(\''+key+'\')" id="rv-'+key+'">Reveal model answer</button><span class="wc" id="wc-'+key+'"></span><span class="unlock" id="ul-'+key+'" style="display:none" onclick="unlock(\''+key+'\')">unlock to improve my answer</span></div>';
  h+='<div class="model" id="md-'+key+'"><div class="mh">Model answer</div><div class="mtext">'+q.model+'</div>';
  if(q.scheme&&q.scheme.length){ h+='<div class="mh">How it is marked</div><ul>'+q.scheme.map(s=>'<li>'+s+'</li>').join('')+'</ul>'; }
  h+='<div class="selfmark"><span>My mark:</span>'+Array.from({length:q.marks+1},(_,i)=>'<button class="mk" data-key="'+key+'" data-v="'+i+'" onclick="setMark(\''+key+'\','+i+')">'+i+'</button>').join('')+'<span class="small" id="mkmsg-'+key+'"></span></div>';
  h+='</div></div>'; return h;
}
function renderPractice(){
  if(!BOOKLET.practice) return '';
  let h='<section class="panel" id="p-prac"><div class="card"><div class="ref">Further practice · exam-style sets on this passage</div><h2>Practice sets</h2><p>'+(BOOKLET.practiceIntro||'Further sets of exam-style questions on the passage. Write first, then reveal and mark yourself.')+'</p></div>';
  BOOKLET.practice.forEach(s=>{
    h+='<div class="card"><h2>'+s.title+'</h2><p>'+(s.intro||'')+'</p>';
    h+='<div class="progress"><span>Questions answered: <b id="pqa-'+s.id+'">0</b>/'+s.questions.length+'</span><span>Self-marked: <b id="pqm-'+s.id+'">0</b>/'+s.questions.reduce((a,q)=>a+q.marks,0)+'</span></div>';
    h+=s.questions.map((q,i)=>renderQ('prac_'+s.id,q,i+1)).join('');
    h+='</div>';
  });
  h+='</section>'; return h;
}
function renderSyn(){
  const s=BOOKLET.synthesis;
  let h='<section class="panel" id="p-syn"><div class="card"><div class="ref">Across the booklet</div><h2>'+s.title+'</h2><p>'+s.intro+'</p>';
  h+=renderQ('syn',{id:'syn',marks:s.marks,type:'essay',q:s.q,model:s.model,scheme:s.scheme},1);
  h+='<h3>'+(BOOKLET.ragText||'How confident do you feel about these three passages?')+'</h3><div class="rag"><button class="r" onclick="setRag(\'Red\')">Red — not yet</button><button class="a" onclick="setRag(\'Amber\')">Amber — getting there</button><button class="g" onclick="setRag(\'Green\')">Green — confident</button></div>';
  h+='<p class="note" style="margin-top:12px">Your answers, marks and notes are saved automatically. Your teacher can see them in the tracker.</p>';
  h+='</div></section>'; return h;
}
function renderAll(){ renderHeader(); renderTabs(); $('panels').innerHTML=renderGuide()+renderToolkit()+BOOKLET.passages.map(renderPassage).join('')+renderPractice()+renderSyn(); bind(); restoreAll(); go('guide'); }

/* ===================== notes ===================== */
let CUR={};
function bind(){
  document.querySelectorAll('mark.hl').forEach(m=>{ m.addEventListener('click',()=>openNote(m.dataset.pid,m.dataset.note)); m.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openNote(m.dataset.pid,m.dataset.note);} }); });
  document.querySelectorAll('textarea[data-q]').forEach(t=>{ t.addEventListener('input',()=>{ state.answers[t.dataset.q]=t.value; if(!state.opened[t.dataset.q]) state.opened[t.dataset.q]=new Date().toISOString(); wc(t.dataset.q); save(); updateProgress(); }); });
  document.querySelectorAll('textarea[data-pnotes]').forEach(t=>{ t.addEventListener('input',()=>{ state.pnotes[t.dataset.pnotes]=t.value; save(); }); });
}
function noteOrder(pid){ return Object.keys(BOOKLET.passages.find(p=>p.id===pid).notes); }
function openNote(pid,id){
  const p=BOOKLET.passages.find(x=>x.id===pid); const n=p.notes[id]; if(!n) return;
  CUR[pid]=id;
  document.querySelectorAll('#p-'+pid+' mark.hl').forEach(m=>m.classList.toggle('on',m.dataset.note===id));
  const mk=document.querySelector('#p-'+pid+' mark.hl[data-note="'+id+'"]');
  if(!state.read[pid+'_'+id]){ state.read[pid+'_'+id]=true; if(mk) mk.classList.add('read'); save(); updateProgress(); }
  const ids=noteOrder(pid), i=ids.indexOf(id);
  let h='<span class="chip '+n.cat+'">'+CATNAME[n.cat]+'</span><div class="ntag">'+n.tag+'</div>'+(n.devices&&n.devices.length?'<div class="devs">'+n.devices.map(d=>'<span class="dev">'+d+'</span>').join('')+'</div>':'');
  h+='<div class="nlat">'+(mk?mk.innerHTML.replace(/<span class="lb"[^>]*><\/span>/g,' / '):'')+'</div><div class="ntr">'+n.tr+'</div>';
  h+='<div class="nsec">What the writer does</div><p>'+n.what+'</p><div class="nsec">The effect</div><p>'+n.effect+'</p>';
  h+='<div class="nsec">How it would be written in the exam</div>';
  if(n.ex.style) h+='<div class="ex"><div class="exh"><span>Style question</span> · 4, 6 or 8 marks · quote, translate, explain, link</div><p>'+n.ex.style+'</p></div>';
  if(n.ex.content) h+='<div class="ex"><div class="exh"><span>Content or impression question</span> · in English, from these lines</div><p>'+n.ex.content+'</p></div>';
  if(n.ex.essay) h+='<div class="ex"><div class="exh"><span>16-mark essay</span> · in English, no Latin needed</div><p>'+n.ex.essay+'</p></div>';
  h+='<div class="nnav"><button class="btn" '+(i<=0?'disabled':'')+' onclick="stepNote(\''+pid+'\',-1)">◀ Previous</button><button class="btn" '+(i>=ids.length-1?'disabled':'')+' onclick="stepNote(\''+pid+'\',1)">Next ▶</button></div>';
  $('nb-'+pid).innerHTML=h; $('ncnt-'+pid).textContent=(i+1)+' of '+ids.length;
  const np=$('np-'+pid); np.classList.add('open'); np.scrollTop=0;
  if(window.innerWidth>900){ const r=np.getBoundingClientRect(); if(r.top<0||r.top>window.innerHeight-80) np.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function stepNote(pid,d){ const ids=noteOrder(pid); const i=ids.indexOf(CUR[pid]); const j=i+d; if(j<0||j>=ids.length) return; openNote(pid,ids[j]); const mk=document.querySelector('#p-'+pid+' mark.hl[data-note="'+ids[j]+'"]'); if(mk&&window.innerWidth>900) mk.scrollIntoView({behavior:'smooth',block:'center'}); }
function closeSheet(){ document.querySelectorAll('.npanel').forEach(n=>n.classList.remove('open')); }

/* ===================== questions ===================== */
function wc(key){ const t=document.querySelector('textarea[data-q="'+key+'"]'); const el=$('wc-'+key); if(!t||!el) return; const n=(t.value.trim().match(/\S+/g)||[]).length; el.textContent=n?(n+' word'+(n===1?'':'s')):''; }
function reveal(key){ const t=document.querySelector('textarea[data-q="'+key+'"]');
  if(t && !t.value.trim() && !state.revealed[key]){ if(!confirm('You have not written an answer yet. Reveal the model anyway?')) return; }
  if(!state.revealed[key]){ state.revealed[key]=new Date().toISOString(); save(); }
  showRevealed(key); }
function showRevealed(key){ const md=$('md-'+key); if(md) md.classList.add('show'); const rv=$('rv-'+key); if(rv){ rv.textContent='Model answer shown'; rv.disabled=true; }
  const t=document.querySelector('textarea[data-q="'+key+'"]'); if(t){ t.readOnly=true; } const ul=$('ul-'+key); if(ul) ul.style.display='inline';
  const mk=state.marks[key]; document.querySelectorAll('.mk[data-key="'+key+'"]').forEach(b=>b.classList.toggle('on',mk!=null&&parseInt(b.dataset.v)===mk)); }
function unlock(key){ const t=document.querySelector('textarea[data-q="'+key+'"]'); if(t){ t.readOnly=false; t.focus(); } const ul=$('ul-'+key); if(ul) ul.style.display='none'; state.opened[key+'_improved']=new Date().toISOString(); save(); }
function setMark(key,v){ state.marks[key]=v; save(); document.querySelectorAll('.mk[data-key="'+key+'"]').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.v)===v));
  const q=allQ().find(x=>x.key===key); const el=$('mkmsg-'+key); if(el&&q){ el.textContent=(v===q.q.marks?'Full marks — make sure every point really matched the scheme.':(v===0?'Read the scheme again, then unlock and improve your answer.':'Which point was missing? Unlock and add it.')); } updateProgress(); }
function setRag(v){ state.rag=v; save(); document.querySelectorAll('.rag button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith(v))); }

function restoreAll(){
  document.querySelectorAll('textarea[data-q]').forEach(t=>{ t.value=state.answers[t.dataset.q]||''; wc(t.dataset.q); if(state.revealed[t.dataset.q]) showRevealed(t.dataset.q); });
  document.querySelectorAll('textarea[data-pnotes]').forEach(t=>{ t.value=state.pnotes[t.dataset.pnotes]||''; });
  document.querySelectorAll('mark.hl').forEach(m=>m.classList.toggle('read',!!state.read[m.dataset.pid+'_'+m.dataset.note]));
  document.querySelectorAll('details.tk').forEach(t=>t.classList.toggle('read',!!state.read['tk_'+t.dataset.tk]));
  if(state.rag) document.querySelectorAll('.rag button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith(state.rag)));
  updateProgress();
}
function updateProgress(){
  if(BOOKLET.toolkit){ const tr=BOOKLET.toolkit.filter(t=>state.read['tk_'+t.id]).length; const el=$('tabdone-toolkit'); if(el) el.textContent=(tr===BOOKLET.toolkit.length)?' ✓':(tr?(' '+tr+'/'+BOOKLET.toolkit.length):''); const c=$('tkr'); if(c) c.textContent=tr; }
  let answered=0,total=0,got=0,max=0;
  BOOKLET.passages.forEach(p=>{ let a=0,m=0,mx=0; p.questions.forEach(q=>{ const k=p.id+'_'+q.id; total++; mx+=q.marks; if((state.answers[k]||'').trim()){ a++; answered++; } if(state.marks[k]!=null){ m+=state.marks[k]; got+=state.marks[k]; } }); max+=mx;
    const nr=Object.keys(p.notes).filter(k=>state.read[p.id+'_'+k]).length;
    $('nr-'+p.id).textContent=nr; $('qa-'+p.id).textContent=a; $('qm-'+p.id).textContent=m;
    $('tabdone-'+p.id).textContent=(a===p.questions.length&&a>0)?' ✓':(a?(' '+a+'/'+p.questions.length):''); });
  (BOOKLET.practice||[]).forEach(s=>{ let a=0,m=0; s.questions.forEach(q=>{ const k='prac_'+s.id+'_'+q.id; total++; max+=q.marks; if((state.answers[k]||'').trim()){ a++; answered++; } if(state.marks[k]!=null){ m+=state.marks[k]; got+=state.marks[k]; } }); const el=$('pqa-'+s.id); if(el) el.textContent=a; const em=$('pqm-'+s.id); if(em) em.textContent=m; });
  if(BOOKLET.practice){ const tot=BOOKLET.practice.reduce((a,s)=>a+s.questions.length,0); const an=BOOKLET.practice.reduce((a,s)=>a+s.questions.filter(q=>(state.answers['prac_'+s.id+'_'+q.id]||'').trim()).length,0); const el=$('tabdone-prac'); if(el) el.textContent=(an===tot&&an>0)?' ✓':(an?(' '+an+'/'+tot):''); }
  const sk='syn_syn'; total++; max+=BOOKLET.synthesis.marks; if((state.answers[sk]||'').trim()){ answered++; $('tabdone-syn').textContent=' ✓'; } else $('tabdone-syn').textContent=''; if(state.marks[sk]!=null) got+=state.marks[sk];
  $('pill').textContent=answered+'/'+total+' answered · '+got+'/'+max+' self-marked';
}

/* ===================== sign-in gate ===================== */
function showGate(){
  const ov=document.createElement('div'); ov.id='rp-gate';
  ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(8,8,14,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Georgia,serif;";
  ov.innerHTML='<div style="max-width:440px;width:100%;background:linear-gradient(180deg,#f6eed6,#e6d6b4);border-top:6px solid #c69a3c;border-radius:14px;padding:26px 26px 22px;box-shadow:0 22px 60px rgba(0,0,0,.6);color:#2b2012;">'
    +'<div style="font-size:12.5px;letter-spacing:2px;color:#8f3320;font-weight:700;">EDUQAS GCSE LATIN · HEROES &amp; VILLAINS · '+(BOOKLET.bookno||('BOOKLET '+BOOKLET.num))+'</div>'
    +'<div style="font-size:23px;color:#7a2f1e;font-weight:800;margin:2px 0 3px;letter-spacing:.5px;">'+BOOKLET.title+': '+BOOKLET.subtitle+'</div>'
    +'<div style="font-size:13px;color:#6b5636;margin-bottom:16px;font-style:italic;">'+BOOKLET.gateLine+'</div>'
    +'<label style="font-size:13px;color:#7a2f1e;font-weight:700;">Class code</label>'
    +'<input id="g-cls" autocomplete="off" value="'+FIXEDCLS+'" readonly tabindex="-1" style="width:100%;box-sizing:border-box;margin:5px 0 4px;padding:11px;border-radius:8px;border:1px solid #c9b686;background:#ece3cc;color:#2b2012;font-size:15px;font-family:Georgia,serif;cursor:default;">'
    +'<div style="font-size:11.5px;color:#7a6e57;margin:0 0 12px;">Your class code is filled in for you — leave it as it is. <span id="g-unlock" style="text-decoration:underline;cursor:pointer;">teacher: change it</span></div>'
    +'<label style="font-size:13px;color:#7a2f1e;font-weight:700;">Your name</label>'
    +'<input id="g-cand" autocomplete="off" placeholder="e.g. Tom" style="width:100%;box-sizing:border-box;margin:5px 0 4px;padding:11px;border-radius:8px;border:1px solid #c9b686;background:#fbf6e6;color:#2b2012;font-size:15px;font-family:Georgia,serif;">'
    +'<div id="g-err" style="color:#a12016;font-size:12.5px;min-height:17px;margin:3px 0 6px;"></div>'
    +'<button id="g-go" style="width:100%;padding:12px;border:0;border-radius:8px;background:linear-gradient(135deg,#caa04a,#9a6b1e);color:#221806;font-weight:800;font-size:15px;cursor:pointer;font-family:Georgia,serif;letter-spacing:.5px;">Open the booklet</button>'
    +'<div style="font-size:11.5px;color:#8a7048;margin-top:13px;line-height:1.5;">Use the <b>same spelling of your name</b> every time, so all your work lands in one place.</div>'
    +'</div>';
  document.body.appendChild(ov);
  $('g-go').addEventListener('click',signIn);
  ov.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); signIn(); } });
  $('g-unlock').addEventListener('click',function(){ const c=$('g-cls'); c.removeAttribute('readonly'); c.removeAttribute('tabindex'); c.style.background='#fbf6e6'; c.style.cursor='text'; c.select(); this.parentNode.removeChild(this); });
  const last=safeGet('hv_booklet_lastname'); if(last) $('g-cand').value=last;
  $('g-cand').focus();
}
let _signingIn=false;
async function signIn(){
  const cls=($('g-cls').value||'').trim().toUpperCase(); const cand=($('g-cand').value||'').trim().replace(/\s+/g,' '); const err=$('g-err');
  if(_signingIn) return;
  if(!cls){ err.textContent='Enter your class code.'; return; }
  if(!/^.{2,40}$/.test(cand)){ err.textContent='Please enter your name (2-40 characters).'; return; }
  _signingIn=true; IDENTITY={cls,cand}; safeSet('hv_booklet_lastname',cand); $('g-go').textContent='Loading your work…'; $('g-go').disabled=true;
  loadLocal();
  const res=await Promise.race([CloudStore.pull(), new Promise(r=>setTimeout(()=>r({ok:false}),6000))]);
  if(res.ok&&res.data&&res.data.state) mergeState(res.data.state);
  safeSet(storeKey(),JSON.stringify(state));
  const g=$('rp-gate'); if(g) g.remove();
  $('whoami').innerHTML='Signed in: <b>'+esc(IDENTITY.cls)+' · '+esc(IDENTITY.cand)+'</b>';
  restoreAll(); setSync(res.ok?'cloud':'offline');
  if(res.ok) save();
}
function signOut(){ IDENTITY=null; location.reload(); }

renderAll();
showGate();
</script>
